# Local development: a Postgres identical on every dev machine.
# Compose auto-reads variable values from `server/.env`.
#
#   docker compose up -d db        # start only the database (run BE via npm)
#   docker compose --profile full up --build   # also run the API in Docker
#
# NOTE: this publishes 5432 on the host so `DATABASE_URL=...@localhost:5432`
# keeps working. If you already run a native Postgres on 5432, stop it first
# (or change the left side of the port mapping, e.g. "5433:5432").

services:
  db:
    image: postgres:16-alpine
    container_name: familycare_db_dev
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-family_care_dev}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-family_care_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional: run the API in Docker too. Enable with `--profile full`.
  api:
    profiles: ['full']
    build: .
    user: root
    env_file: .env
    environment:
      # Inside the Docker network the DB host is the service name `db`.
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_DATABASE:-family_care_dev}?schema=public
      ADMIN_DOCKER_ENABLED: 'true'
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      BACKUP_POSTGRES_CONTAINER: familycare_db_dev
      CHOKIDAR_USEPOLLING: 'true'
      FACE_AI_BASE_URL: http://face-ai-service:8000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: sh -c "npx prisma generate --generator client && npx prisma migrate deploy && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      face-ai-service:
        condition: service_healthy
    restart: unless-stopped

  face-ai-service:
    profiles: ['full']
    build:
      context: ../face-ai-service
      dockerfile: Dockerfile
    environment:
      FACE_AI_MODEL_NAME: ${FACE_AI_MODEL_NAME:-buffalo_l}
      FACE_AI_DETECTION_SIZE: ${FACE_AI_DETECTION_SIZE:-640}
      FACE_AI_DEVICE: ${FACE_AI_DEVICE:-cpu}
      FACE_SCAN_MAX_FACES: ${FACE_SCAN_MAX_FACES:-20}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata_dev:
