services:
  postgres:
    image: postgres:14-alpine
    container_name: family-care-postgres
    restart: unless-stopped
    env_file:
      - ./server/.env.docker
    volumes:
      - family-care-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - family-care-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: family-care-server:latest
    container_name: family-care-server
    restart: unless-stopped
    env_file:
      - ./server/.env.docker
    environment:
      APP_ENV: docker
      APP_PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      SWAGGER_ENABLED: "false"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - family-care-network

volumes:
  family-care-postgres-data:

networks:
  family-care-network:
    driver: bridge
